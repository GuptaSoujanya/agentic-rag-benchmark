[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-benchmark"
version = "0.3.2"
description = "Diagnostic evaluation framework for Agentic RAG retrieval precision and claim faithfulness."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[project.scripts]
rag-eval = "rag_bench.cli:main"
