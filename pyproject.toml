[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-benchmark"
version = "0.3.0"
description = "Evaluation toolkit measuring retrieval accuracy, hallucinations, and context precision in multi-step AI agents."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "soujanya.gupta@ethara.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[project.scripts]
rag-eval = "rag_bench.cli:main"
